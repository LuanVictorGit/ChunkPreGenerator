# chunkpregenerator.adm - Permission required to use plugin commands.
# Usually assigned to admins or players allowed to pre-generate chunks.

Config:

    # tag: Defines the prefix that the plugin will use in chat messages.
    # Example: if you set "&6[Chunk]", all plugin messages will appear like: [Chunk] Your message
    # &6 is a Minecraft color code (gold/yellow).
    tag: "&6[Chunk]"

    # chunks_per_tick: How many chunks the plugin will load per server "tick".
    # One tick = 1/20 of a second (50ms).
    # Setting a high value may overload the server, so choose wisely.
    # Example: 5 chunks per tick means the plugin will load 5 chunks every tick.
    chunks_per_tick: 5

    # timePerChunk: Time in milliseconds that the plugin will spend loading each chunk.
    # Usually 50ms is enough since it equals 1 tick.
    # You can increase or decrease depending on your server performance.
    timePerChunk: 50

    # max_border_size: Maximum size of the area the plugin will pre-generate.
    # This is the limit of the "border" in blocks.
    # Example: 5000 means it can pre-generate chunks up to 5000 blocks from the center.
    # ⚠️ Do NOT use extremely high values like 1,000,000, as it may freeze the server or use too much disk space.
    max_border_size: 5000